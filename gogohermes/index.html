  <!-- The built bundle is injected by Vite at build time (see vite.config.ts).
       Nothing here may reference _app/app-*.js or asset-*.css by hashed name:
       those are build OUTPUTS, and naming a previous build's hash in the source
       makes the next build fail with "Rollup failed to resolve import". That is
       exactly what happened — a deploy script wrote the runtime paths back into
       this file. -->

<body>
<script>
    /* The Google Maps key, read by the pickup address field. In the page rather
       than the bundle because it is public by nature — it is restricted by HTTP
       referrer, so a leaked copy is useless from another domain. */
    window.__GOGO_MAPS_KEY = "AIzaSyAY6CTTEKmEkkwjP4YMAnUyIADO7k2uED8";
  </script>
  <div id="root"></div>
  <!-- This is the entry Vite rewrites at build time into the hashed bundle.
       It must point at the SOURCE, never at a previous build's filename. -->
  <script type="module" src="/src/main.tsx"></script>
<!-- runs before the app boots: clears any address left over from a previous
     visit, so the pickup field never arrives pre-filled -->
<script src="/gogo/assets/gogo-session.js"></script>
