<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- GOGO app icon.

       Mark: Tabler Icons `arrows-exchange` (MIT) — two parallel horizontal
       arrows in opposite directions, each with a single diagonal at its head.
       Drawn on its own 24x24 grid, scaled up here.

       Two departures from Tabler: stroke raised to match Anton's stem weight,
       and round caps replaced with butt + miter so the mark is squared like the
       rest of the interface. Ground is ink with 18-of-512 corners, not an
       app-store squircle. -->
  <rect x="0" y="0" width="512" height="512" rx="18" fill="#0B0B0B"/>
  <g transform="translate(76 76) scale(15)" fill="none"
     stroke="#8DB600" stroke-width="6.43"
     stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="6">
    <path d="M7 10h14l-4 -4"/>
    <path d="M17 14h-14l4 4"/>
  </g>
</svg>