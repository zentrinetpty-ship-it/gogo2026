<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- GOGO app icon: ink ground, lime wordmark.
       The swap arrows were removed at the owner's request; the mark is now the
       GO GO wordmark alone, set in the same heavy display face as the site.
       Squared corners (18 of 512) to match the interface, not a squircle. -->
  <rect x="0" y="0" width="512" height="512" rx="18" fill="#0B0B0B"/>
  <text x="256" y="256" text-anchor="middle" dominant-baseline="central"
        font-family="Anton, 'Arial Black', Impact, sans-serif"
        font-size="196" font-weight="900" letter-spacing="-4" fill="#8DB600">GO</text>
  <text x="414" y="256" text-anchor="end" dominant-baseline="central"
        font-family="Anton, 'Arial Black', Impact, sans-serif"
        font-size="196" font-weight="900" letter-spacing="-4" fill="#A3E635">GO</text>
</svg>
